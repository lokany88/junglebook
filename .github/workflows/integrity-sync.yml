name: JungleBook Integrity Sync

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GPG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnupg jq
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import -
          echo "trust\n5\nsave\n" | gpg --command-fd 0 --edit-key "$GPG_KEY_ID" trust || true
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}

      - name: Verify latest commits
        run: |
          echo "Verifying last 5 commits..."
          git log -5 --show-signature | grep -E "Good signature|BAD|expired|revoked" || true

      - name: Ensure branch protection
        run: |
          OWNER="lokany88"
          REPO="junglebook"
          BRANCH="main"
          ACCEPT_HDR="Accept: application/vnd.github+json"

          gh api -X PUT -H "$ACCEPT_HDR" /repos/$OWNER/$REPO/branches/$BRANCH/protection --input - <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": []
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 1
            },
            "restrictions": null,
            "required_linear_history": true,
            "allow_force_pushes": false,
            "allow_deletions": false
          }
          JSON

          gh api -X POST -H "$ACCEPT_HDR" /repos/$OWNER/$REPO/branches/$BRANCH/protection/required_signatures >/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create signed release
        run: |
          TAG="v1.0.$(date +'%y%m%d-%H%M')"
          git tag -s "$TAG" -m "Autoverified release $TAG"
          git push origin "$TAG"
          echo "Creating GitHub release..."
          gh release create "$TAG" --notes "Autogenerated verified release" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate audit log
        run: |
          echo "==== JungleBook Integrity Audit ====" > integrity-audit.log
          git log -3 --show-signature >> integrity-audit.log
          echo "Uploading audit artifact..."
          gh release upload "$TAG" integrity-audit.log --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
