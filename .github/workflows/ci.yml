name: JungleBook CI

on:
  push:
    branches:
      - main
      - ci-upgrade
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --workspaces --legacy-peer-deps

      - name: Run CI Heal Guard
        run: bash .github/workflows/ci-heal-guard.sh

      - name: Build with Turbo
        run: npx turbo run build --cache-dir=.turbo
