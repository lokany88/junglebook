name: JungleBook CI • Self-Healing + Subworkspace Sync

on:
  push:
    branches:
      - main
      - ci-upgrade
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 🧼 Clean and reinstall dependencies
        run: |
          echo "🧹 Removing old lockfile and node_modules..."
          rm -f package-lock.json
          rm -rf node_modules
          npm install -g turbo
          echo "📦 Installing fresh dependencies..."
          npm install --legacy-peer-deps

      - name: 🔁 Auto-Sync Subworkspaces
        run: |
          echo "🔍 Scanning all subworkspaces..."
          find apps packages -type f -name "package.json" | while read pkg; do
            dir=$(dirname "$pkg")
            echo "📦 Syncing dependencies in $dir"
            cd "$dir"
            if [ -f package-lock.json ]; then
              npm install --legacy-peer-deps || true
            else
              npm install --package-lock-only --legacy-peer-deps || true
              npm install --legacy-peer-deps || true
            fi
            cd - > /dev/null
          done
          echo "✅ Subworkspace sync complete."

      - name: 🧠 Auto-Fix Missing Dependencies
        run: |
          echo "🔍 Scanning for missing dependencies..."
          missing=$(npm ls 2>&1 | grep "missing:" || true)
          if [ -n "$missing" ]; then
            echo "🛠 Missing dependencies found:"
            echo "$missing"
            echo "Installing missing packages..."
            npm install --legacy-peer-deps
            echo "✅ Missing dependencies fixed."
          else
            echo "✅ No missing dependencies detected."
          fi

      - name: 🧹 Lint
        run: npm run lint || true

      - name: 🧠 Type Check
        run: npx turbo run typecheck || true

      - name: 🧪 Run Tests (Vitest)
        run: npm run test --if-present

      - name: 🏗️ Build All Apps
        run: npm run build

      - name: ✅ Verify Build Output
        run: |
          echo "🔎 Checking for build outputs..."
          ls -R apps/dashboard-charts/apps/web/.next || echo "⚠️ No Next.js build output found."
          ls -R packages || echo "⚠️ No package build output found."

      - name: 💾 Auto-Commit Dependency Fixes
        if: success()
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "📝 Committing dependency fixes..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json */*/package-lock.json || true
            git commit -m "🤖 Auto-fixed missing dependencies & synced subworkspaces"
            git push origin HEAD:${{ github.ref }}
          else
            echo "✅ No dependency changes to commit."
          fi

      - name: 📤 Upload Coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: 🔔 Notify Slack (on failure)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ JungleBook CI failed — check workflow logs for missing deps or build errors."}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}

