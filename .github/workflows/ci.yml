name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      HUSKY: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 🧹 Clean old installs
        run: |
          echo "🧹 Removing old lockfiles and node_modules..."
          rm -f package-lock.json
          rm -rf node_modules
          npm install -g turbo

      - name: 📦 Install all dependencies (root + subapps)
        run: |
          echo "📦 Installing root dependencies..."
          HUSKY=0 npm install --legacy-peer-deps
          echo "📦 Installing subworkspace dependencies..."
          find apps -type f -name "package.json" | while read pkg; do
            dir=$(dirname "$pkg")
            echo "📦 Syncing $dir"
            cd "$dir"
            HUSKY=0 npm install --legacy-peer-deps || true
            cd - > /dev/null
          done
          echo "✅ All dependencies installed."

      - name: 🏗️ Build project
        run: |
          echo "🏗️ Running Turbo build..."
          npx turbo run build

      - name: ✅ Notify success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ JungleBook CI build succeeded!"}' \
          $SLACK_WEBHOOK_URL

      - name: ❌ Notify failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ JungleBook CI failed — check workflow logs."}' \
          $SLACK_WEBHOOK_URL
