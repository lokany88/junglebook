name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 🧹 Clean & patch repo
        run: |
          echo "🧹 Cleaning workspace..."
          rm -f package-lock.json
          rm -rf node_modules
          npm install -g jq
          npm install -g turbo

          # 🔇 Disable prepare script (Husky)
          echo "Temporarily disabling prepare script..."
          if grep -q '"prepare":' package.json; then
            cp package.json package.json.bak
            jq 'del(.scripts.prepare)' package.json.bak > package.json
          fi

          # 🩹 Fix turbo.json key name for v2+
          if [ -f turbo.json ]; then
            echo "🩹 Patching turbo.json (pipeline → tasks)..."
            jq 'if has("pipeline") then .tasks = .pipeline | del(.pipeline) else . end' turbo.json > turbo.tmp && mv turbo.tmp turbo.json
          fi

      - name: 📦 Install dependencies
        run: |
          echo "📦 Installing root dependencies..."
          npm install --legacy-peer-deps
          echo "📦 Installing subworkspace dependencies..."
          find apps -type f -name "package.json" | while read pkg; do
            dir=$(dirname "$pkg")
            echo "📦 Syncing $dir"
            cd "$dir"
            npm install --legacy-peer-deps || true
            cd - > /dev/null
          done
          echo "✅ All dependencies installed."

      - name: 🏗️ Build with local Turbo
        run: |
          echo "🏗️ Building project..."
          npx turbo run build

      - name: ✅ Notify success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ JungleBook CI build succeeded!"}' \
          $SLACK_WEBHOOK_URL

      - name: ❌ Notify failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ JungleBook CI failed — check workflow logs."}' \
          $SLACK_WEBHOOK_URL
