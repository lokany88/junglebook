---
name: JungleBook CI

"on":
  push:
    branches:
      - main
      - ci-upgrade
  pull_request:
    branches:
      - main

env:
  NODE_ENV: production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install yamllint
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint

      - name: Lint YAML files
        run: yamllint .github/workflows

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: >-
            turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: >-
            turbo-${{ runner.os }}-

      - name: Install Turbo
        run: npm install turbo@latest --save-dev --legacy-peer-deps

      - name: Ensure PostCSS plugin present
        run: |
          npm install @tailwindcss/postcss@latest --save-exact || true
          find apps -type f -name "package.json" | grep web | while read -r d
          do
            dir=$(dirname "$d")
            cd "$dir" || exit
            npm install @tailwindcss/postcss@latest --save-exact || true
            cd - >/dev/null || exit
          done

      - name: Install dependencies (root + sub-apps)
        run: |
          npm install --legacy-peer-deps
          find apps -type f -name "package.json" | while read -r pkg
          do
            dir=$(dirname "$pkg")
            cd "$dir" || exit
            npm install --legacy-peer-deps || true
            cd - >/dev/null || exit
          done

      - name: Auto-heal Sidebar href type error
        shell: bash
        run: |
          SIDEBAR_PATH=$(
            find apps -type f -path "*/layoutParts/Sidebar.tsx" | head -n 1
          )
          if [ -n "$SIDEBAR_PATH" ]; then
            node -e '
              const fs = require("fs");
              const p = process.env.SIDEBAR_PATH || process.argv[1];
              let code = fs.readFileSync(p, "utf8");
              code = code.replace(
                /href=\{[^}]+\}/g,
                "href={item.href as any}"
              );
              fs.writeFileSync(p, code);
            ' "$SIDEBAR_PATH"
          fi

      - name: Build project
        run: npx turbo run build --cache-dir=.turbo

      - name: Save Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: >-
            turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: >-
            turbo-${{ runner.os }}-

      - name: Notify Slack (success)
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ JungleBook CI build succeeded"}' \
            "$SLACK_WEBHOOK_URL"

      - name: Notify Slack (failure)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"❌ JungleBook CI build failed"}' \
            "$SLACK_WEBHOOK_URL"
