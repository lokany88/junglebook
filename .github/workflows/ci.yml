---
name: JungleBook CI

on:
  push:
    branches:
      - main
      - ci-upgrade
  pull_request:
    branches:
      - main

env:
  NODE_ENV: production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Auto-heal environment and dependencies
        run: |
          echo "🔧 Ensuring Turbo & PostCSS setup..."
          npm install turbo@latest --save-dev --legacy-peer-deps
          npm install @tailwindcss/postcss@latest --save-exact --legacy-peer-deps
          find apps -type f -name "package.json" | while read -r pkg
          do
            dir=$(dirname "$pkg")
            cd "$dir" || exit
            npm install @tailwindcss/postcss@latest --save-exact --legacy-peer-deps || true
            cd - >/dev/null || exit
          done

          echo "🔗 Rebuilding @components symlinks..."
          find apps -type d -path "*/src/app" | while read -r app
          do
            mkdir -p "$app/components"
            ln -sf "$app/manager/(shell)/layoutParts/Sidebar.tsx" "$app/components/Sidebar.tsx" 2>/dev/null || true
            ln -sf "$app/manager/(shell)/layoutParts/Topbar.tsx" "$app/components/Topbar.tsx" 2>/dev/null || true
          done

          echo "🧹 Cleaning old caches..."
          rm -rf .turbo node_modules apps/**/node_modules
          npm install --legacy-peer-deps

      - name: Build project
        run: npx turbo run build --cache-dir=.turbo

      - name: Save Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Notify Slack (success)
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || 'https://example.com/webhook' }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ JungleBook CI build succeeded"}' \
            "$SLACK_WEBHOOK_URL"

      - name: Notify Slack (failure)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || 'https://example.com/webhook' }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"❌ JungleBook CI build failed"}' \
            "$SLACK_WEBHOOK_URL"
