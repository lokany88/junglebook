name: JungleBook CI

on:
  push:
    branches: [main, ci-upgrade]
  pull_request:
    branches: [main]

env:
  NODE_ENV: production
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ────────────────────────────────────────────────
      # 1️⃣ Checkout Repository
      # ────────────────────────────────────────────────
      - name: 🧩 Checkout
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────
      # 2️⃣ Setup Node.js
      # ────────────────────────────────────────────────
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # ────────────────────────────────────────────────
      # 3️⃣ Ensure PostCSS Plugin Present
      # ────────────────────────────────────────────────
      - name: 🩹 Ensure PostCSS plugin present
        run: |
          echo "🔍 Ensuring @tailwindcss/postcss installed..."
          npm install @tailwindcss/postcss@latest --save-exact || true
          for d in $(find apps -type f -name package.json | grep web); do
            dir=$(dirname "$d")
            echo "📦 Ensuring $dir"
            cd "$dir"
            npm install @tailwindcss/postcss@latest --save-exact || true
            cd - >/dev/null
          done
          echo "✅ PostCSS plugin verified."

      # ────────────────────────────────────────────────
      # 4️⃣ Install Dependencies
      # ────────────────────────────────────────────────
      - name: 📦 Install dependencies
        run: |
          echo "📦 Installing root dependencies..."
          npm install --legacy-peer-deps
          echo "📦 Installing subworkspace dependencies..."
          find apps -type f -name "package.json" | while read pkg; do
            dir=$(dirname "$pkg")
            echo "📦 Syncing $dir"
            cd "$dir"
            npm install --legacy-peer-deps || true
            cd - >/dev/null
          done
          echo "✅ All dependencies installed."

      # ────────────────────────────────────────────────
      # 5️⃣ Build via Turbo
      # ────────────────────────────────────────────────
      - name: 🏗️ Building project
        run: |
          echo "🏗️ Building project..."
          npx turbo run build

      # ────────────────────────────────────────────────
      # 6️⃣ Slack Notifications
      # ────────────────────────────────────────────────
      - name: 📢 Notify Slack (success)
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ JungleBook CI build succeeded!"}' \
          $SLACK_WEBHOOK_URL

      - name: 📢 Notify Slack (failure)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ JungleBook CI failed — check workflow logs."}' \
          $SLACK_WEBHOOK_URL
