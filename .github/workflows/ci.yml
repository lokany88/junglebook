name: JungleBook CI

on:
  push:
    branches: [ "main", "ci-upgrade" ]
  pull_request:
    branches: [ "main", "ci-upgrade" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --workspaces --legacy-peer-deps

      - name: Prebuild Self-Heal Hook
        run: |
          echo "🔧 Running JungleBook prebuild self-heal hook..."
          npm --workspace ./apps/dashboard-charts/apps/web install next react react-dom --legacy-peer-deps
          ls -la ./apps/dashboard-charts/apps/web/node_modules/.bin || true
          echo "✅ Prebuild completed."

      - name: Run CI Heal Guard
        run: bash .github/workflows/ci-heal-guard.sh

      - name: Build with Turbo
        run: npx turbo run build --cache-dir=.turbo
