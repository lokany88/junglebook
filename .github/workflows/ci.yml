name: JungleBook CI

on:
  push:
    branches: [ "main", "ci-upgrade" ]
  pull_request:
    branches: [ "main", "ci-upgrade" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --workspaces --legacy-peer-deps

      - name: CI Auto-Heal Guard
        run: bash .github/workflows/ci-heal-guard.sh

      - name: Build
        run: npx turbo run build --cache-dir=.turbo

      - name: Slack Notification
        if: always()
        run: |
          if [ "$GITHUB_JOB_STATUS" = "success" ]; then
            MSG="✅ JungleBook CI build succeeded"
          else
            MSG="❌ JungleBook CI build failed"
          fi
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MSG\"}" "$SLACK_WEBHOOK_URL"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

