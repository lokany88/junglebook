name: JungleBook CI

on:
  push:
    branches: [main, ci-upgrade]
  pull_request:
    branches: [main]

env:
  NODE_ENV: production
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 🔇 Disable Husky prepare script (if present)
        run: |
          if grep -q '"prepare":' package.json; then
            echo "Removing prepare script (Husky)..."
            cp package.json package.json.bak
            jq 'del(.scripts.prepare)' package.json.bak > package.json
          fi

      - name: Ensure PostCSS plugin present
        run: |
          echo "🔍 Ensuring @tailwindcss/postcss installed..."
          npm install @tailwindcss/postcss@latest --save-exact || true
          for d in $(find apps -type f -name package.json | grep web); do
            dir=$(dirname "$d")
            echo "📦 Ensuring $dir"
            cd "$dir"
            npm install @tailwindcss/postcss@latest --save-exact || true
            cd - >/dev/null
          done
          echo "✅ PostCSS plugin verified."

      - name: 📦 Install dependencies
        run: |
          echo "📦 Installing all dependencies..."
          npm install --legacy-peer-deps
          find apps -type f -name "package.json" | while read pkg; do
            dir=$(dirname "$pkg")
            echo "📦 Syncing $dir"
            cd "$dir"
            npm install --legacy-peer-deps || true
            cd - >/dev/null
          done
          echo "✅ All dependencies installed."

      - name: 🏗️ Build project
        run: |
          echo "🏗️ Building project..."
          npx turbo run build

      - name: 📢 Notify Slack (success)
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ JungleBook CI build succeeded}' \
          $SLACK_WEBHOOK_URL

      - name: 📢 Notify Slack (failure)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ JungleBook CI failed — check workflow logs."}' \
          $SLACK_WEBHOOK_URL
