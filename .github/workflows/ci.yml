name: JungleBook CI

on:
  push:
    branches:
      - main
      - ci-upgrade
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: 🧭 Checkout repository
        uses: actions/checkout@v4

      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 🧹 Clean workspace
        run: |
          echo "🧹 Removing old lockfiles and node_modules..."
          rm -f package-lock.json
          rm -rf node_modules
          npm install -g turbo

      - name: 📦 Install dependencies
        run: |
          echo "📦 Installing root dependencies..."
          npm install --legacy-peer-deps
          echo "📦 Installing subworkspace dependencies..."
          find apps -type f -name "package.json" | while read pkg; do
            dir=$(dirname "$pkg")
            echo "📦 Syncing $dir"
            cd "$dir"
            npm install --legacy-peer-deps || true
            cd - > /dev/null
          done
          echo "✅ All dependencies installed."

      - name: 🧪 Run tests
        run: |
          echo "🧪 Running tests..."
          npm run test || true

      - name: 🔍 Lint
        run: |
          echo "🔍 Running lint..."
          npm run lint || true

      - name: 🧩 Typecheck
        run: |
          echo "🧩 Type checking..."
          npx turbo run typecheck || true

      - name: 🏗️ Build
        run: |
          echo "🏗️ Running production build..."
          npm run build

      - name: ✅ Slack success message
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ JungleBook CI passed successfully!"}' \
          $SLACK_WEBHOOK_URL

      - name: ❌ Slack failure message
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ JungleBook CI failed — check workflow logs."}' \
          $SLACK_WEBHOOK_URL
