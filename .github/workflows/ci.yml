name: JungleBook CI

on:
  push:
    branches:
      - main
      - ci-upgrade
  pull_request:
    branches:
      - main

env:
  NODE_ENV: production
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ────────────────────────────────────────────────
      # 1️⃣ Checkout Repo
      # ────────────────────────────────────────────────
      - name: 🧭 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ────────────────────────────────────────────────
      # 2️⃣ Clean Workspace
      # ────────────────────────────────────────────────
      - name: 🧹 Cleaning workspace
        run: |
          echo "🧹 Cleaning workspace..."
          rm -f package-lock.json
          rm -rf node_modules
          sudo apt-get update -y
          sudo apt-get install -y jq
          npm install -g turbo

          echo "🔇 Temporarily disabling prepare script..."
          if grep -q '"prepare":' package.json; then
            cp package.json package.json.bak
            jq 'del(.scripts.prepare)' package.json.bak > package.json
          fi

          echo "🩹 Patching turbo.json (pipeline → tasks)..."
          if [ -f turbo.json ]; then
            jq 'if has("pipeline") then .tasks = .pipeline | del(.pipeline) else . end' turbo.json > turbo.tmp && mv turbo.tmp turbo.json
          fi

      # ────────────────────────────────────────────────
      # 3️⃣ Ensure PostCSS Plugin Present
      # ────────────────────────────────────────────────
      - name: 🩹 Ensure PostCSS plugin present
        run: |
          echo "🔍 Ensuring @tailwindcss/postcss is installed..."
          npm install @tailwindcss/postcss@latest --save-exact || true
          for d in $(find apps -type f -name package.json | grep web); do
            dir=$(dirname "$d")
            echo "📦 Ensuring $dir"
            cd "$dir"
            npm install @tailwindcss/postcss@latest --save-exact || true
            cd - >/dev/null
          done
          echo "✅ PostCSS plugin present in all workspaces."

      # ────────────────────────────────────────────────
      # 4️⃣ Install Dependencies
      # ────────────────────────────────────────────────
      - name: 📦 Install dependencies
        run: |
          echo "📦 Installing root dependencies..."
          npm install --legacy-peer-deps
          echo "📦 Installing subworkspace dependencies..."
          find apps -type f -name "package.json" | while read pkg; do
            dir=$(dirname "$pkg")
            echo "📦 Syncing $dir"
            cd "$dir"
            npm install --legacy-peer-deps || true
            cd - >/dev/null
          done
          echo "✅ All dependencies installed."

      # ────────────────────────────────────────────────
      # 5️⃣ Build All Packages
      # ────────────────────────────────────────────────
      - name: 🏗️ Building project
        run: |
          echo "🏗️ Building project..."
          npx turbo run build

      # ────────────────────────────────────────────────
      # 6️⃣ Slack Notifications
      # ────────────────────────────────────────────────
      - name: 📢 Notify Slack (success)
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ JungleBook CI build succeeded!"}' \
          $SLACK_WEBHOOK_URL

      - name: 📢 Notify Slack (failure)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ JungleBook CI failed — check workflow logs."}' \
          $SLACK_WEBHOOK_URL
