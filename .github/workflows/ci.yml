name: JungleBook CI

on:
  workflow_dispatch:
  push:
    branches: [ci-upgrade]
  pull_request:
    branches: [ci-upgrade]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (workspaces)
        run: npm install --workspaces --legacy-peer-deps

      - name: Ensure Next binary (global + local fallback)
        run: |
          set -eux
          WEB_PATH="./apps/dashboard-charts/apps/web"
          mkdir -p "$WEB_PATH/node_modules/.bin"
          npm install -g next@15 react react-dom || true
          ln -sf "$(command -v next)" "$WEB_PATH/node_modules/.bin/next" || true
          npm --workspace "$WEB_PATH" install next@15 react react-dom --legacy-peer-deps || true
          ls -la "$WEB_PATH" || true
          ls -la "$WEB_PATH/node_modules" || true
          ls -la "$WEB_PATH/node_modules/.bin" || true
          command -v next || true

      - name: Run CI Heal Guard (optional)
        run: |
          if [ -f ".github/workflows/ci-heal-guard.sh" ]; then
            bash .github/workflows/ci-heal-guard.sh
          else
            echo "ci-heal-guard.sh not found; continuing"
          fi

      - name: Build with Turbo (with manual Next fallback)
        run: |
          set -eux
          npx -y turbo@^2 run build --cache-dir=.turbo || (cd ./apps/dashboard-charts/apps/web && npx -y next@15 build)
