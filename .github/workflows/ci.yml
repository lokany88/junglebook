name: Build
on:
  push:
    branches:
      - ci-upgrade
  pull_request:
    branches:
      - ci-upgrade

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Remove stale lockfiles
        run: |
          if [ -f "/home/runner/work/junglebook/junglebook/../package-lock.json" ]; then
            rm -f "/home/runner/work/junglebook/junglebook/../package-lock.json"
          fi
          if [ -f "/Users/elokaanyaorah/package-lock.json" ]; then
            rm -f "/Users/elokaanyaorah/package-lock.json"
          fi

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install Turbo
        run: npm install turbo@latest --save-dev --legacy-peer-deps

      - name: Install PostCSS plugin everywhere
        run: |
          npm install @tailwindcss/postcss@latest --save-exact --legacy-peer-deps || true
          find apps -type f -name "package.json" | while read -r pkg; do
            dir=$(dirname "$pkg")
            cd "$dir" || exit
            npm install @tailwindcss/postcss@latest --save-exact --legacy-peer-deps || true
            cd - >/dev/null || exit
          done

      - name: Install all dependencies
        run: |
          npm install --legacy-peer-deps
          find apps -type f -name "package.json" | while read -r pkg; do
            dir=$(dirname "$pkg")
            cd "$dir" || exit
            npm install --legacy-peer-deps || true
            cd - >/dev/null || exit
          done

      - name: Rebuild component symlinks
        run: |
          find apps -type d -path "*/src/app" | while read -r app; do
            mkdir -p "$app/components"
            ln -sf "$app/manager/(shell)/layoutParts/Sidebar.tsx" "$app/components/Sidebar.tsx" 2>/dev/null || true
            ln -sf "$app/manager/(shell)/layoutParts/Topbar.tsx" "$app/components/Topbar.tsx" 2>/dev/null || true
          done

      - name: Patch Sidebar href typing
        run: |
          SIDEBAR_PATH=$(find apps -type f -path "*/layoutParts/Sidebar.tsx" | head -n 1)
          if [ -n "$SIDEBAR_PATH" ]; then
            node -e "import fs from 'fs'; const p='$SIDEBAR_PATH'; let c=fs.readFileSync(p,'utf8'); c=c.replace(/href=\{[^}]+\}/g,'href={item.href as any}'); fs.writeFileSync(p,c); console.log('Patched',p)"
          fi

      - name: Build project
        run: npx turbo run build --cache-dir=.turbo

      - name: Auto-format code if Prettier warnings exist
        run: |
          npx prettier --check . || (npx prettier --write . && git config user.email "ci@junglebook.local" && git config user.name "JungleBook CI" && git add . && git commit -m "chore: auto-format via CI" && git push)

      - name: Save Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Slack notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || 'https://example.com/webhook' }}
        run: |
          if [ "$GITHUB_JOB_STATUS" = "success" ]; then
            MSG="✅ JungleBook CI build succeeded"
          else
            MSG="❌ JungleBook CI build failed"
          fi
          curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"$MSG\"}" "$SLACK_WEBHOOK_URL"
