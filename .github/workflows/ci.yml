name: JungleBook CI

on:
  workflow_dispatch:
  push:
    branches: [ci-upgrade]
  pull_request:
    branches: [ci-upgrade]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (workspaces)
        run: npm install --workspaces --legacy-peer-deps

      - name: Verify and Inject Next Binary
        run: |
          set -eux
          WEB_PATH="./apps/dashboard-charts/apps/web"
          mkdir -p "$WEB_PATH/node_modules/.bin"
          npm install -g next@15 react react-dom || true
          npm --workspace "$WEB_PATH" install next@15 react react-dom --legacy-peer-deps || true

          echo "Checking binary availability..."
          which next || echo "Global next not found"
          ls -l "$(npm root -g)/.bin" || true
          ls -la "$WEB_PATH/node_modules/.bin" || true
          echo "Done verifying Next binary."

      - name: Run CI Heal Guard (optional)
        run: |
          if [ -f ".github/workflows/ci-heal-guard.sh" ]; then
            bash .github/workflows/ci-heal-guard.sh
          else
            echo "ci-heal-guard.sh not found; continuing"
          fi

      - name: Build with Turbo (fallback to direct Next.js)
        run: |
          set -eux
          if ! npx -y turbo@^2 run build --cache-dir=.turbo; then
            echo "Turbo failed; trying direct Next.js build"
            cd ./apps/dashboard-charts/apps/web
            npx -y next@15 build
          fi
